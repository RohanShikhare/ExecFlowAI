version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: execflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: execflow
      POSTGRES_USER: execflow
      POSTGRES_PASSWORD: execflow
    ports:
      - "5432:5432"
    volumes:
      - execflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./execflow-backend
    container_name: execflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/execflow
      DB_USERNAME: execflow
      DB_PASSWORD: execflow
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-this-is-not-a-real-secret}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      STORAGE_BASE_PATH: /app/uploads
      WHISPER_SERVICE_URL: http://whisper:9000
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - execflow-uploads:/app/uploads

  frontend:
    build: ./execflow-frontend
    container_name: execflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

  # Free, self-hosted speech-to-text. First startup downloads the model
  # weights (~150MB for "base") - that's the only time it needs internet.
  # Swap ASR_MODEL to "small" or "medium" for better accuracy at the cost
  # of speed/RAM; "base" is a reasonable default on modest hardware.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: execflow-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-base}
      ASR_ENGINE: openai_whisper
    ports:
      - "9000:9000"
    volumes:
      - execflow-whisper-cache:/root/.cache/whisper

volumes:
  execflow-pg-data:
  execflow-uploads:
  execflow-whisper-cache:
